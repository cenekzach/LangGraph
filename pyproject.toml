[project]
name = "langgraph-devops-poc"
version = "0.1.0"
description = "Requirements-first multi-node LangGraph workflow with MCP filesystem and python executor"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.40",
  "langchain-openai>=0.2.10",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "pytest>=8.3.0"
]

[project.scripts]
langgraph-devops-poc = "poc_single_node:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
